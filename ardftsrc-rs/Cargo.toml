[package]
name = "ardftsrc-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://github.com/phayes/ardftsrc-rs"
description = "Commmandline wav and flac sample-rate converter powered by ardftsrc."

[dependencies]
ardftsrc = { path = "../ardftsrc" }
audioadapter.workspace = true
audioadapter-buffers.workspace = true
clap.workspace = true
flac-codec.workspace = true
i24.workspace = true
mimalloc.workspace = true
rayon = { workspace = true, optional = true }
symphonia.workspace = true
wavers.workspace = true

[features]
default = ["avx", "neon", "sse", "wasm_simd", "rayon", "gpu", "high_precision"]
bessel = ["ardftsrc/bessel"]
rayon = ["dep:rayon", "ardftsrc/rayon"]
avx = ["ardftsrc/avx"]
neon = ["ardftsrc/neon"]
sse = ["ardftsrc/sse"]
wasm_simd = ["ardftsrc/wasm_simd"]
high_precision = ["ardftsrc/high_precision"]
gpu = ["ardftsrc/gpu"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
