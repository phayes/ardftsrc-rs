[package]
name = "ardftsrc-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Commmandline wav and flac sample-rate converter powered by ardftsrc."

[dependencies]
ardftsrc = { path = "../ardftsrc" }
audioadapter.workspace = true
audioadapter-buffers.workspace = true
clap.workspace = true
flac-codec.workspace = true
i24.workspace = true
mimalloc.workspace = true
rayon = { workspace = true, optional = true }
wavers.workspace = true

[features]
# f128 requires a nightly rustc, so (unlike the old dd_fft feature this replaces) it is
# opt-in rather than on by default: pass --features f128 explicitly (with a nightly toolchain)
# to include it.
default = ["avx", "neon", "sse", "wasm_simd", "rayon"]
bessel = ["ardftsrc/bessel"]
rayon = ["dep:rayon", "ardftsrc/rayon"]
avx = ["ardftsrc/avx"]
neon = ["ardftsrc/neon"]
sse = ["ardftsrc/sse"]
wasm_simd = ["ardftsrc/wasm_simd"]
f128 = ["ardftsrc/f128"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
