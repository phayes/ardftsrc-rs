[package]
name = "ardftsrc-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
homepage = "https://github.com/phayes/ardftsrc-rs"
description = "Command-line wav and flac sample-rate converter powered by ardftsrc."

[dependencies]
ardftsrc = { path = "../ardftsrc" }
audioadapter.workspace = true
audioadapter-buffers.workspace = true
clap.workspace = true
flac-codec.workspace = true
i24.workspace = true
mimalloc.workspace = true
rayon = { workspace = true, optional = true }
symphonia.workspace = true
wavers.workspace = true

[features]
default = ["avx", "neon", "sse", "wasm_simd", "rayon", "high_precision", "bessel"]
bessel = ["ardftsrc/bessel"]
rayon = ["dep:rayon", "ardftsrc/rayon"]
avx = ["ardftsrc/avx"]
neon = ["ardftsrc/neon"]
sse = ["ardftsrc/sse"]
wasm_simd = ["ardftsrc/wasm_simd"]
high_precision = ["ardftsrc/high_precision"]

# GPU support is unreleased and is not included in the crates.io package.
# To opt in, clone this repository, uncomment the GPU lines in ../ardftsrc/Cargo.toml, and uncomment the feature below.
# gpu = ["ardftsrc/gpu"]
