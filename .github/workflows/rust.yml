name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check
      run: cargo check --verbose
    - name: Run tests
      run: cargo test --workspace --no-default-features --features "avx,neon,sse,wasm_simd,rayon,audioadapter" --verbose
    - name: Install nightly toolchain for f128
      uses: dtolnay/rust-toolchain@nightly
    - name: Run f128 tests
      run: cargo +nightly test -p ardftsrc --no-default-features --features "f128" --lib --verbose
