name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check
      run: cargo check --verbose
    - name: Run tests
      run: cargo test --workspace --no-default-features --features "avx,neon,sse,wasm_simd,rayon,audioadapter" --verbose
    - name: Run high_precision tests
      run: cargo test -p ardftsrc --no-default-features --features "high_precision" --lib --verbose
