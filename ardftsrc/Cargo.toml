[package]
name = "ardftsrc"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
num-traits.workspace = true
realfft.workspace = true
thiserror.workspace = true
audioadapter = { workspace = true, optional = true }
audio-core = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
rodio = { version = "0.22", default-features = false, optional = true }
tracing = { version = "0.1", optional = true }
num-complex = { workspace = true, optional = true }
num-integer = { workspace = true, optional = true }
twofloat = { workspace = true, optional = true }
f256 = { workspace = true, optional = true }
rustc_apfloat = { workspace = true, optional = true }

# GPU backend (unreleased).
ash = { version = "0.38", optional = true }
vkfft-rs = { git = "https://github.com/phayes/vkfft-rs", optional = true, features = ["vulkan-runtime"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
ash-molten = { version = "0.20", optional = true, features = ["pre-built"] }

[dev-dependencies]
audioadapter-buffers.workspace = true
criterion.workspace = true
dasp_signal.workspace = true
md5.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
wavers.workspace = true
mimalloc.workspace = true

[features]
default = ["avx", "neon", "sse", "wasm_simd"]

# Unreleased Vulkan/VkFFT GPU backend.
gpu = ["dep:ash", "dep:ash-molten", "dep:vkfft-rs"]

# SIMD features (enabled by default)
avx = ["realfft/avx"]
neon = ["realfft/neon"]
sse = ["realfft/sse"]
wasm_simd = ["realfft/wasm_simd"]

# Optional features (disabled by default)
rodio = ["dep:rodio"]
rayon = ["dep:rayon"]
audioadapter = ["dep:audio-core", "dep:audioadapter"]
tracing = ["dep:tracing"]

# Adds the high-precision sample types `DoubleDouble`, `F128`, and `F256` for extreme quality.
# Use one as a resampler's sample type, e.g. `InterleavedResampler::<F128>`.
high_precision = [
    "dep:num-complex",
    "dep:num-integer",
    "dep:twofloat",
    "dep:f256",
    "dep:rustc_apfloat",
]

 # Rodio features (examples only)
rodio-playback= ["rodio/playback"]

[[bench]]
name = "ardftsrc_throughput"
harness = false

[[bench]]
name = "ardftsrc_chunk_time"
harness = false

[[bench]]
name = "ardftsrc_latency"
harness = false

[[bench]]
name = "rubato_sync"
harness = false

[[example]]
name = "rodio_adapter"
required-features = ["rodio-playback"]

[[example]]
name = "rodio_adapter_with_spans"
required-features = ["rodio-playback"]

[package.metadata.docs.rs]
features = ["rodio", "high_precision"]
