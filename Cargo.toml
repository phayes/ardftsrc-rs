[workspace]
members = ["ardftsrc", "ardftsrc-rs", "ardftsrc-report"]
resolver = "3"

[workspace.package]
version = "0.0.17"
edition = "2024"
description = "High-quality audio sample-rate conversion using the ARDFTSRC algorithm."
license = "MIT OR Apache-2.0"
authors = ["Patrick Hayes <patrick.d.hayes@gmail.com>"]
repository = "https://github.com/phayes/ardftsrc-rs"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", features = ["html_reports"] }
dasp_signal = "0.11"
flac-codec = { version = "1", features = ["rayon"] }
i24 = "=1.0.1"
md5 = "0.8"
mimalloc = "0.1"
num-traits = "0.2"
rayon = "1"
realfft = "3.5"
rubato = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wavers = "1.5"
symphonia = { version = "0.6", default-features = false, features = ["flac", "ogg", "id3v2"] }
audioadapter = "3"
audioadapter-buffers = "3"
audio-core = "0.2"
rodio = { version = "0.22", default-features = false }
num-complex = "0.4"
num-integer = "0.1.40"
twofloat = "0.8"
f256 = { version = "0.11", default-features = false, features = ["std"] }
rustc_apfloat = "=0.2.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
