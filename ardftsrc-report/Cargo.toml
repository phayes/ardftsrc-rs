[package]
name = "ardftsrc-report"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Combined THD+N and HydrogenAudio quality reporting for ardftsrc's f64 resamplers."
publish = false

[dependencies]
ardftsrc = { path = "../ardftsrc" }
clap.workspace = true
dasp_signal.workspace = true
hydrogen_src = { git = "https://github.com/phayes/hydrogen_src" }
mimalloc.workspace = true
realfft.workspace = true
serde.workspace = true
serde_json.workspace = true
tabled = "0.22.0"

[features]
default = []

# Also runs every thdn sweep case with ardftsrc's f128 (~113-bit) FFT backend. Requires a
# nightly rustc, so (unlike the old dd_fft feature this replaces) it is opt-in rather than
# on by default: pass --features f128 explicitly (with a nightly toolchain) to include it.
f128 = ["ardftsrc/f128"]

[[bin]]
name = "ardftsrc-report"
path = "src/main.rs"
