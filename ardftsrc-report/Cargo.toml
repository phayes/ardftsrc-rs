[package]
name = "ardftsrc-report"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Combined THD+N and HydrogenAudio quality reporting for ardftsrc's f64 resamplers."
publish = false

[dependencies]
ardftsrc = { path = "../ardftsrc" }
clap.workspace = true
dasp_signal.workspace = true
hydrogen_src = { git = "https://github.com/phayes/hydrogen_src" }
mimalloc.workspace = true
realfft.workspace = true
serde.workspace = true
serde_json.workspace = true
tabled = "0.22.0"

[features]
default = []

# Also runs every thdn sweep case with each of ardftsrc's high-precision FFT backends
# (double-double, f128, f256). Opt-in because it multiplies sweep time several-fold.
high_precision = ["ardftsrc/high_precision"]

[[bin]]
name = "ardftsrc-report"
path = "src/main.rs"
